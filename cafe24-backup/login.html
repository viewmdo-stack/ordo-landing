<!--@layout(/layout/basic/layout.html)-->

<div module="member_login" id="{$member_login_module_id}" data-ez="contents-1tmpy6k-1">

    <!--@css(/css/module/member/login.css)-->
    <!--@js(/js/module/member/login.js)-->
    <!--
        $forbidIpUrl = member/adminFail.html
        $defaultReturnUrl = /product/detail.html?product_no=11
    -->

    <fieldset class="form">

        <style>
        .section.path, .section.titleArea { display:none }
        .xans-member-login { max-width:440px; margin:0 auto; padding:0 20px; box-sizing:border-box }
        #ordo-login-title { text-align:center;font-size:16px;font-weight:500;padding:40px 0 30px }
        #ordo-sns-top { margin-bottom:16px }
        #ordo-sns-top .ordo-btn { display:flex;align-items:center;justify-content:center;width:100%;height:52px;border-radius:6px;font-size:15px;font-weight:700;text-decoration:none;margin-bottom:10px;gap:8px;box-sizing:border-box;cursor:pointer }
        #ordo-sns-top .ordo-btn.kakao { background:#FEE500;color:#191919 }
        #ordo-sns-top .ordo-btn.naver { background:#03C75A;color:#fff }
        #ordo-sns-top .ordo-divider { display:flex;align-items:center;gap:10px;margin:8px 0 16px;color:#999;font-size:13px }
        #ordo-sns-top .ordo-divider::before,
        #ordo-sns-top .ordo-divider::after { content:"";flex:1;height:1px;background:#ddd }
        .login__sns { display:none!important }
        #ordo-sns-block { display:none!important }
        .login__util { display:none!important }
        .wrap_find { display:none!important }
        .login__security { display:none!important }
        .login { width:100%!important }
        .login__id { display:block!important; width:100%!important }
        .login__pw { display:block!important; width:100%!important }
        .login input[type=text],
        .login input[type=password] { display:block!important; width:100%!important; box-sizing:border-box!important }
        .login__button .btnNormal { display:none!important }
        .login__button { width:100%!important }
        #ordo-login-btn { display:block;width:100%;height:52px;line-height:52px;text-align:center;background:#1a1a1a;color:#fff;font-size:16px;font-weight:700;border-radius:6px;box-sizing:border-box;cursor:pointer;border:none;margin-top:8px }
        #ordo-join-btn { display:block;text-align:center;margin-top:16px;font-size:14px;text-decoration:underline;color:#222 }
        #ordo-bottom-row { display:flex;align-items:center;gap:4px;font-size:13px;margin:8px 0 4px;width:100%;color:#666 }
        #ordo-bottom-row a { font-size:13px;color:#666;text-decoration:none }
        #ordo-bottom-row .sep { color:#ddd }
        #ordo-autologin { width:14px;height:14px;cursor:pointer;margin:0 2px 0 0 }
        </style>

        <div id="ordo-login-title">로그인/회원가입</div>

        <div id="ordo-sns-top">
            <a href="#none" onclick="ordoKakaoLogin(); return false;" class="ordo-btn kakao">
                <svg width="20" height="20" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg"><path d="M255.5 48C132.6 48 32 130.7 32 233.3c0 67.9 42.8 127.5 107.3 162.4l-27.3 101.3c-2.4 8.8 7.4 15.8 15 10.7l120.4-80.3c2.7.2 5.4.3 8.1.3 122.9 0 223.5-82.7 223.5-185.3S378.4 48 255.5 48z" fill="#191919"></path></svg>
                카카오톡 간편 로그인/회원가입
            </a>
            <a href="#" onclick="return false;" class="ordo-btn naver">
                <svg width="16" height="16" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M16.273 12.845L7.376 0H0v24h7.727V11.155L16.624 24H24V0h-7.727z" fill="#fff"/></svg>
                네이버 간편 로그인/ 회원가입
            </a>
            <div class="ordo-divider">또는</div>
        </div>

        <div class="login">
            <div class="login__id">
                <input type="text" name="member_id" id="member_id" class="inputText" placeholder="아이디 또는 이메일">
            </div>
            <div class="login__pw">
                <input type="password" name="member_passwd" id="member_passwd" class="inputText" placeholder="비밀번호">
            </div>
        </div>

        <div class="wrap_security">
            {$save_id_checkbox}
        </div>

        <div id="ordo-bottom-row">
            <input type="checkbox" id="ordo-autologin">
            <label for="ordo-autologin">자동로그인</label>
            <span style="flex:1"></span>
            <a href="/member/login.html?type=nologin">비회원 주문조회</a>
            <span class="sep">|</span>
            <a href="/member/id/find_id.html">ID/PW 찾기</a>
        </div>

        <div class="login__button">
            {$login_button}
            <button type="button" id="ordo-login-btn" onclick="ordoLogin()">로그인</button>
        </div>

        <a href="/member/agreement.html" id="ordo-join-btn">일반 회원가입</a>

    </fieldset>

    <script>
    var ORDO_TARGET = '/product/detail.html?product_no=11';
    var ORDO_NO_REDIRECT = location.search.indexOf('returnUrl') !== -1;

    document.getElementById('ordo-autologin').addEventListener('change', function() {
        var real = document.getElementById('check_save_id');
        if (real) real.checked = this.checked;
    });

    (function() {
        if (ORDO_NO_REDIRECT) return;
        function trySetReturnUrl() {
            var ru = document.querySelector('input[name="returnUrl"]');
            if (ru && ru.value !== ORDO_TARGET) { ru.value = ORDO_TARGET; }
        }
        trySetReturnUrl();
        var observer = new MutationObserver(function() { trySetReturnUrl(); });
        observer.observe(document.body, { childList: true, subtree: true });
        setTimeout(function(){ observer.disconnect(); }, 3000);
    })();

    function ordoLogin() {
        if (!ORDO_NO_REDIRECT) {
            var ru = document.querySelector('input[name="returnUrl"]');
            if (ru) ru.value = ORDO_TARGET;
        }
        var realCheck = document.getElementById('check_save_id');
        var ordoCheck = document.getElementById('ordo-autologin');
        if (realCheck && ordoCheck) realCheck.checked = ordoCheck.checked;
        var form = document.querySelector('form[action*="Member/login"]');
        if (form && typeof MemberAction !== 'undefined') { MemberAction.login(form.id); }
    }

    function ordoKakaoLogin() {
        if (!ORDO_NO_REDIRECT) { localStorage.setItem('ordo_kakao_pending', '1'); }
        if (typeof MemberAction !== 'undefined') { MemberAction.kakaosyncLogin('bdf295c0fb4d34c3a0885c62f06add08'); }
    }
    </script>

</div>
