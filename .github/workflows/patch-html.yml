name: Patch index.html

on:
  workflow_dispatch:

  jobs:
    patch:
        runs-on: ubuntu-latest
            permissions:
                  contents: write
                      steps:
                            - name: Checkout
                                    uses: actions/checkout@v4

                                          - name: Patch S3 left/right sections per 0612 PDF
                                                  run: |
                                                            python3 - << 'PYEOF'
                                                            import re

                                                            with open('index.html', 'r', encoding='utf-8') as f:
                                                                html = f.read()

                                                                # --- P1: s3-left section ---
                                                                # Find and replace the entire s3-left block
                                                                old_left = re.search(
                                                                    r'<!-- s3-left.*?(?=<!-- s3-right|<!-- s3 end|$)',
                                                                        html, re.DOTALL
                                                                        )

                                                                        new_left = """<!-- s3-left: image right 65%, text overlay bottom -->
                                                                            <div style="width:100%; margin-bottom:40px; position:relative; overflow:visible;">
                                                                                  <p style="text-align:center; padding:0 24px 16px; margin:0; line-height:1.8; font-size:clamp(15px,4vw,18px); font-weight:bold;">
                                                                                          그 냄새에 마음이 먼저 멈칫하기 전에,<br>그의 하루를 먼저 생각해 보세요.
                                                                                                </p>
                                                                                                      <div style="position:relative; width:65%; margin-left:auto; margin-right:0;">
                                                                                                              <img src="images/s3-left.jpg" style="width:100%; display:block;">
                                                                                                                      <div style="position:absolute; bottom:0; left:-55%; right:0; padding:10px 12px 12px;">
                                                                                                                                <p style="margin:0; line-height:1.9;">
                                                                                                                                            <span style="background:#1a3a6b; color:white; padding:3px 8px; display:inline; box-decoration-break:clone; -webkit-box-decoration-break:clone; font-weight:bold; font-size:clamp(13px,3.8vw,16px);">힘든 내색 없이 견디고, 땀을 삼켜내고,</span><br>
                                                                                                                                                        <span style="background:#1a3a6b; color:white; padding:3px 8px; display:inline; box-decoration-break:clone; -webkit-box-decoration-break:clone; font-weight:bold; font-size:clamp(13px,3.8vw,16px);">오늘도 누군가를 위해</span><br>
                                                                                                                                                                    <span style="background:#1a3a6b; color:white; padding:3px 8px; display:inline; box-decoration-break:clone; -webkit-box-decoration-break:clone; font-weight:bold; font-size:clamp(13px,3.8vw,16px);">자신의 자리를 지켜냈을 하루.</span>
                                                                                                                                                                              </p>
                                                                                                                                                                                      </div>
                                                                                                                                                                                            </div>
                                                                                                                                                                                                </div>
                                                                                                                                                                                                
                                                                                                                                                                                                    """
                                                                                                                                                                                                    
                                                                                                                                                                                                    # --- P2: s3-right section ---
                                                                                                                                                                                                    old_right = re.search(
                                                                                                                                                                                                        r'<!-- s3-right.*?(?=\s*</section>|\s*<!--\s*(?!s3-))',
                                                                                                                                                                                                            html, re.DOTALL
                                                                                                                                                                                                            )
                                                                                                                                                                                                            
                                                                                                                                                                                                            new_right = """<!-- s3-right: image left 65%, text overlay bottom -->
                                                                                                                                                                                                                <div style="width:100%; margin-bottom:40px; position:relative; overflow:visible;">
                                                                                                                                                                                                                      <div style="position:relative; width:65%; margin-right:auto; margin-left:0;">
                                                                                                                                                                                                                              <img src="images/s3-right.jpg" style="width:100%; display:block;">
                                                                                                                                                                                                                                      <div style="position:absolute; bottom:0; left:0; right:-55%; padding:10px 12px 12px;">
                                                                                                                                                                                                                                                <p style="margin:0; line-height:1.9;">
                                                                                                                                                                                                                                                            <span style="background:#1a3a6b; color:white; padding:3px 8px; display:inline; box-decoration-break:clone; -webkit-box-decoration-break:clone; font-weight:bold; font-size:clamp(13px,3.8vw,16px);">체취는 단순한 냄새가 아니라,</span><br>
                                                                                                                                                                                                                                                                        <span style="background:#1a3a6b; color:white; padding:3px 8px; display:inline; box-decoration-break:clone; -webkit-box-decoration-break:clone; font-weight:bold; font-size:clamp(13px,3.8vw,16px);">열정적인 하루가 피부 위에 남긴</span><br>
                                                                                                                                                                                                                                                                                    <span style="background:#1a3a6b; color:white; padding:3px 8px; display:inline; box-decoration-break:clone; -webkit-box-decoration-break:clone; font-weight:bold; font-size:clamp(13px,3.8vw,16px);">흔적일 수 있습니다.</span>
                                                                                                                                                                                                                                                                                              </p>
                                                                                                                                                                                                                                                                                                      </div>
                                                                                                                                                                                                                                                                                                            </div>
                                                                                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                                                                                
                                                                                                                                                                                                                                                                                                                    """
                                                                                                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                                                                                    print('s3-left found:', old_left is not None)
                                                                                                                                                                                                                                                                                                                    print('s3-right found:', old_right is not None)
                                                                                                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                                                                                    if old_left:
                                                                                                                                                                                                                                                                                                                        html = html[:old_left.start()] + new_left + html[old_left.end():]
                                                                                                                                                                                                                                                                                                                            print('s3-left replaced')
                                                                                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                                                                                            # Re-search after replacement
                                                                                                                                                                                                                                                                                                                            if old_right:
                                                                                                                                                                                                                                                                                                                                old_right2 = re.search(
                                                                                                                                                                                                                                                                                                                                        r'<!-- s3-right.*?(?=\s*</section>|\s*<!--\s*(?!s3-))',
                                                                                                                                                                                                                                                                                                                                                html, re.DOTALL
                                                                                                                                                                                                                                                                                                                                                    )
                                                                                                                                                                                                                                                                                                                                                        if old_right2:
                                                                                                                                                                                                                                                                                                                                                                html = html[:old_right2.start()] + new_right + html[old_right2.end():]
                                                                                                                                                                                                                                                                                                                                                                        print('s3-right replaced')
                                                                                                                                                                                                                                                                                                                                                                        
                                                                                                                                                                                                                                                                                                                                                                        with open('index.html', 'w', encoding='utf-8') as f:
                                                                                                                                                                                                                                                                                                                                                                            f.write(html)
                                                                                                                                                                                                                                                                                                                                                                            print('Done')
                                                                                                                                                                                                                                                                                                                                                                            PYEOF
                                                                                                                                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                                                                                                                                                  - name: Commit
                                                                                                                                                                                                                                                                                                                                                                                          run: |
                                                                                                                                                                                                                                                                                                                                                                                                    git config user.email "actions@github.com"
                                                                                                                                                                                                                                                                                                                                                                                                              git config user.name "GitHub Actions"
                                                                                                                                                                                                                                                                                                                                                                                                                        git add index.html
                                                                                                                                                                                                                                                                                                                                                                                                                                  git diff --cached --stat
                                                                                                                                                                                                                                                                                                                                                                                                                                            git commit -m "Fix: S3 left/right image+text layout per 0612 PDF P1-P2" || echo "No changes"
                                                                                                                                                                                                                                                                                                                                                                                                                                                      git push
