name: Download Videos from Drive

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download 4step.mp4
        run: |
          curl -L "https://drive.usercontent.google.com/download?id=1MAUk0KHZhYNyYtoY0zECsXK_mkJAcpsA&export=download&confirm=t" -o images/4step.mp4
          ls -la images/4step.mp4

      - name: Commit videos
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add images/4step.mp4
          git commit -m "Add: 4step.mp4 video from Drive" || echo "No changes to commit"
          git push
